    <rect x="-10" y="-6" width="20" height="16" rx="3" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
    <path d="M-6,-6 V-12 a6,6 0 0 1 12,0 V-6" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
    <circle cx="0" cy="4" r="2.5" fill="#00e5ff"/>
  </g>

  <!-- title -->
  <text x="600" y="185" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-weight="800" font-size="54">
