    <path d="M40 15 L170 15 L185 -8 L200 36 L215 15 L330 15" fill="none" stroke="url(#cGithub)" stroke-width="2"/>
    <path d="M870 15 L985 15 L1000 -8 L1015 36 L1030 15 L1160 15" fill="none" stroke="url(#titleGrad2)" stroke-width="2"/>
    <text x="600" y="21" text-anchor="middle" font-size="16" fill="#c7cdea">
