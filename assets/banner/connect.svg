    <circle cx="100" cy="62" r="10" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="112" cy="50" r="2.2" fill="#ffffff"/>
    <text x="100" y="132" text-anchor="middle" font-family="Fira Code,monospace" font-weight="700" font-size="20" fill="#f2f4ff">INSTAGRAM</text>
    <text x="100" y="156" text-anchor="middle" font-family="Fira Code,monospace" font-size="13" fill="#ffb673">summersalt1.0</text>
    <rect x="30" y="188" width="140" height="30" rx="15" fill="#2a1608"/>
    <text x="100" y="207" text-anchor="middle" font-family="Fira Code,monospace" font-size="12" font-weight="600" fill="#ffb673">FOLLOW ME →</text>
