  <g transform="translate(600,610)">
    <rect x="-170" y="-17" width="340" height="34" rx="17" fill="#0b0a17" stroke="#2a3a63" stroke-width="1.5"/>
    <circle cx="-143" cy="0" r="9" fill="#0d0a1e" stroke="#00e5ff" stroke-width="2"/>
    <rect x="-147" y="-4" width="8" height="7" rx="1.5" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="-15" y="5" text-anchor="middle" font-family="Fira Code,monospace" font-size="13" letter-spacing="1" fill="#c7cdea">
