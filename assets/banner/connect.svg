    <text x="100" y="132" text-anchor="middle" font-family="Fira Code,monospace" font-weight="700" font-size="20" fill="#f2f4ff">EMAIL</text>
    <text x="100" y="153" text-anchor="middle" font-family="Fira Code,monospace" font-size="13" fill="#ff9db8">ninaddeo11</text>
