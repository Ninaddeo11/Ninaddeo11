  <!-- cards -->
  <!-- GitHub -->
  <g transform="translate(70,260)">
    <rect width="200" height="230" rx="18" fill="#0b0a17" stroke="url(#cGithub)" stroke-width="2"/>
    <circle cx="100" cy="62" r="42" fill="#0d0a1e" stroke="url(#cGithub)" stroke-width="2.5"/>
    <path transform="translate(80,42) scale(0.85)" fill="#ffffff" d="M20 0C8.9 0 0 8.9 0 20c0 8.9 5.8 16.4 13.8 19 1 .2 1.4-.4 1.4-1v-3.5c-5.6 1.2-6.8-2.7-6.8-2.7-.9-2.3-2.3-2.9-2.3-2.9-1.9-1.3.1-1.3.1-1.3 2.1.1 3.2 2.2 3.2 2.2 1.9 3.2 4.9 2.3 6.1 1.8.2-1.4.7-2.3 1.3-2.9-4.5-.5-9.2-2.2-9.2-9.9 0-2.2.8-4 2-5.4-.2-.5-.9-2.6.2-5.4 0 0 1.7-.5 5.5 2 1.6-.4 3.3-.7 5-.7s3.4.2 5 .7c3.8-2.6 5.5-2 5.5-2 1.1 2.8.4 4.9.2 5.4 1.2 1.4 2 3.2 2 5.4 0 7.7-4.7 9.4-9.2 9.9.7.6 1.4 1.9 1.4 3.7v5.5c0 .5.4 1.1 1.4 1C34.2 36.4 40 28.9 40 20 40 8.9 31.1 0 20 0Z"/>
