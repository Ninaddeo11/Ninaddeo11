<svg width="1200" height="660" viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04030c"/>
      <stop offset="50%" stop-color="#080418"/>
      <stop offset="100%" stop-color="#0a0512"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="titleGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b5cff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <pattern id="gridc" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#151a33" stroke-width="0.6" opacity="0.6"/>
    </pattern>

    <!-- card gradients -->
    <linearGradient id="cGithub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b967ff"/><stop offset="100%" stop-color="#6a2dff"/>
    </linearGradient>
    <linearGradient id="cLinkedin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d8bff"/><stop offset="100%" stop-color="#1c4fd6"/>
    </linearGradient>
    <linearGradient id="cEmail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4d8d"/><stop offset="100%" stop-color="#ff1f5e"/>
    </linearGradient>
    <linearGradient id="cInsta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb020"/><stop offset="100%" stop-color="#ff6a3d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" fill="url(#bgc)"/>
  <rect width="1200" height="660" fill="url(#gridc)"/>

  <!-- circuit corner traces -->
  <g stroke="#25325c" stroke-width="2" fill="none" opacity="0.7">
    <path d="M0 40 H140 L170 70 H400"/>
    <path d="M1200 40 H1060 L1030 70 H800"/>
    <path d="M0 620 H160 L190 590 H420"/>
    <path d="M1200 620 H1040 L1010 590 H780"/>
    <circle cx="140" cy="40" r="4" fill="#00e5ff"/>
    <circle cx="1060" cy="40" r="4" fill="#7b5cff"/>
    <circle cx="160" cy="620" r="4" fill="#ff4d8d"/>
    <circle cx="1040" cy="620" r="4" fill="#ffb020"/>
  </g>

  <!-- shield icon -->
  <g transform="translate(600,60)">
    <path d="M0,-38 L34,-24 V6 C34,32 17,48 0,58 C-17,48 -34,32 -34,6 V-24 Z"
