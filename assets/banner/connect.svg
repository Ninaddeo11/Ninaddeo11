    <rect x="30" y="188" width="140" height="30" rx="15" fill="#150f28"/>
    <text x="100" y="207" text-anchor="middle" font-family="Fira Code,monospace" font-size="12" font-weight="600" fill="#b98cff">VIEW PROFILE →</text>
    <rect x="20" y="222" width="160" height="4" rx="2" fill="url(#cGithub)" opacity="0.8"/>
  </g>

  <!-- LinkedIn -->
  <g transform="translate(290,260)">
