  <!-- Email -->
  <g transform="translate(510,260)">
    <rect width="200" height="230" rx="18" fill="#0b0a17" stroke="url(#cEmail)" stroke-width="2"/>
    <circle cx="100" cy="62" r="42" fill="#0d0a1e" stroke="url(#cEmail)" stroke-width="2.5"/>
    <rect x="78" y="48" width="44" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
