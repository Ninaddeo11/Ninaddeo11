    <circle cx="100" cy="62" r="42" fill="#0d0a1e" stroke="url(#cLinkedin)" stroke-width="2.5"/>
    <text x="100" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="34" fill="#ffffff">in</text>
    <text x="100" y="132" text-anchor="middle" font-family="Fira Code,monospace" font-weight="700" font-size="20" fill="#f2f4ff">LINKEDIN</text>
